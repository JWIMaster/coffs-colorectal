name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Derive the canonical origin and base path. GitHub Pages serves project
      # repositories from https://<owner>.github.io/<repo>/, and the owner
      # context preserves the account's capitalisation, so it is lower-cased
      # here to match the host the site is actually served from.
      #
      # The variable is SITE_ORIGIN, not SITE_URL: actions/configure-pages
      # injects its own SITE_URL later in the job and would override ours.
      - name: Resolve site URLs
        run: |
          set -euo pipefail
          echo "SITE_BASE=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          echo "SITE_ORIGIN=https://${GITHUB_REPOSITORY_OWNER,,}.github.io" >> "$GITHUB_ENV"

      # The site has no dependencies, so there is nothing to install and no
      # package manager step. The build is plain Node plus the standard library.
      - name: Build the site
        run: node build.mjs --base="$SITE_BASE" --out=dist

      # Fail loudly rather than publishing a broken site.
      - name: Verify the build
        run: |
          set -euo pipefail
          echo "base=$SITE_BASE origin=$SITE_ORIGIN"
          python3 src/_lib/verify.py dist "$SITE_BASE" "${SITE_ORIGIN}${SITE_BASE}/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
