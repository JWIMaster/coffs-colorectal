<!-- avoid-ai-design-ignore-file: K7 -->
<!-- K7 is a cross-file false positive: :focus-visible is defined once, globally,
     in src/assets/css/site.css and applies to every interactive element here.
     Masking it would hide a real focus regression on these elements. -->
<header class="chrome" id="site-header">
  <div class="shell chrome__inner">
    <a class="brand" href="/" aria-label="{{brandName}} — home">
      <span class="brand__mark" aria-hidden="true">{{iconStethoscope}}</span>
      <span class="brand__text">
        <span class="brand__name">{{brandName}}</span>
        <span class="brand__sub">{{brandSub}}</span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
        {{navLinks}}
    </nav>

    <div class="chrome__actions">
      <!-- Collapses to an icon below 48rem so the header cannot force the page
           wider than the viewport, and opens into a labelled pill above it. -->
      <a class="btn call-btn" href="tel:{{tel}}" aria-label="Call the practice on {{phone}}">
        {{iconPhone}}<span class="call-btn__text">{{phone}}</span>
      </a>
      <button class="icon-btn theme-toggle" type="button" data-theme-toggle
              aria-label="Switch between light and dark appearance">
        {{iconSun}}{{iconMoon}}
      </button>
      <button class="icon-btn menu-toggle" type="button" data-menu-open
              aria-expanded="false" aria-controls="nav-sheet" aria-label="Open menu">
        {{iconMenu}}
      </button>
    </div>
  </div>
</header>

<!--
  The menu carries the pages you can go to, and nothing else. It used to repeat
  the entire footer: seventeen links, three of them listed twice inside the sheet
  itself, which made a specific page — such as the surgeon's profile — hard to
  pick out. The footer under every page still lists everything.
-->
<div class="nav-sheet" id="nav-sheet" data-open="false" hidden>
  <div class="nav-sheet__scrim" data-menu-close></div>
  <div class="nav-sheet__panel" role="dialog" aria-modal="true" aria-label="Site menu">
    <span class="nav-sheet__grip" aria-hidden="true"></span>
    <div class="nav-sheet__head">
      <p class="nav-sheet__title">Menu</p>
      <button class="icon-btn" type="button" data-menu-close aria-label="Close menu">
        {{iconClose}}
      </button>
    </div>

    <nav class="nav-sheet__nav" aria-label="Site">
      {{sheetLinks}}
    </nav>

    <div class="nav-sheet__foot">
      <a class="btn btn--primary" href="tel:{{tel}}">{{iconPhone}}Call {{phone}}</a>
      <a class="btn btn--ghost" href="/contact-us/">Contact and directions</a>
    </div>
  </div>
</div>
